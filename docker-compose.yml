services:
  # Phase 1~2 — 벡터 저장소와 대화 메모리를 한 인스턴스에서 함께 쓴다.
  # spring-boot-docker-compose 가 이 서비스를 감지해 접속 정보를 자동 주입한다.
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      org.springframework.boot.service-connection: postgres
